name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./gradlew test spotlessCheck bootJar --no-daemon
      - run: node --test frontend/tests/*.test.js
  smoke:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-deliveryflow-secret-at-least-thirty-two-bytes
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-deliveryflow-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose up --build --wait --wait-timeout 300
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
